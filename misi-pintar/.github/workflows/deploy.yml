name: Deploy ke cPanel

on:
  push:
    branches:
      - main        # Ganti sesuai nama branch utama Anda (main / master)

jobs:
  # ── Job 1: CI — Typecheck & Lint ────────────────────────────────────────────
  ci:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

  # ── Job 2: Deploy ke cPanel via SSH ─────────────────────────────────────────
  deploy:
    name: Deploy ke cPanel
    runs-on: ubuntu-latest
    needs: ci               # Hanya deploy jika CI lulus

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Deploy via SSH ke cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          # Jalankan di folder aplikasi yang sudah di-clone oleh cPanel Git Version Control
          script: |
            set -e
            echo "📂 Masuk ke folder aplikasi..."
            cd ~/public_html/misipintar

            echo "🔄 Pull kode terbaru dari GitHub..."
            git pull origin main

            echo "🚀 Jalankan deploy script..."
            chmod +x deploy-cpanel.sh
            ./deploy-cpanel.sh

            echo "🔁 Restart Node.js app..."
            # cPanel Passenger restart — sentuh file tmp/restart.txt
            mkdir -p tmp && touch tmp/restart.txt

            echo "✅ Deploy selesai!"
