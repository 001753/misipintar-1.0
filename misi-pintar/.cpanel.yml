---
# ─────────────────────────────────────────────────────────────────────────────
# cPanel Git Version Control — Auto-Deploy Script
# ─────────────────────────────────────────────────────────────────────────────
#
# File ini dijalankan OTOMATIS oleh cPanel setelah git pull dari GitHub.
# Semua perintah dijalankan dari folder ROOT repository.
#
# PRASYARAT (lakukan SEKALI via SSH sebelum push pertama):
#   cd ~/public_html/misipintar/misi-pintar
#   cp .env.example .env && nano .env   # isi semua nilai wajib
#
# SETUP cPanel:
#   1. cPanel → Git Version Control → Create
#      Clone URL      : https://github.com/USERNAME/REPO.git
#      Repository Path: /home/USERNAME/public_html/misipintar
#   2. cPanel → Node.js App → Create Application
#      Application root       : public_html/misipintar
#      Application startup file: app.js
#      Node.js version        : 22.x
# ─────────────────────────────────────────────────────────────────────────────

deployment:
  tasks:
    # deploy-cpanel.sh menangani segalanya:
    #   1. Deteksi npm asli (bukan wrapper cPanel)
    #   2. Install deps ke ./node_modules lokal
    #   3. prisma generate
    #   4. prisma migrate deploy
    #   5. next build (tanpa prebuild hook — langsung ./node_modules/.bin/next build)
    #   6. Copy public/ dan .next/static/ ke standalone output
    - bash misi-pintar/deploy-cpanel.sh
